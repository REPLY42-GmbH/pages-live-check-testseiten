<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Inter:wght@400;600&amp;display=swap">
<style>
:root{--r42-text:#111827;--r42-grund:#FFFFFF;--r42-akzent:#F59E0B;--r42-primaer:#B0306A;--r42-schrift-ueberschrift:"Merriweather", Georgia, serif;--r42-schrift-text:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;--r42-abstand:8px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--r42-schrift-text,system-ui,-apple-system,"Segoe UI",sans-serif);color:var(--r42-text,#1f2937);background:var(--r42-grund,#ffffff);line-height:1.6;font-size:17px}
h1,h2,h3,h4{font-family:var(--r42-schrift-ueberschrift,inherit);line-height:1.2;margin:0 0 .5em}
p{margin:0 0 1em}
img{max-width:100%;height:auto;display:block}
main{display:flex;flex-direction:column;gap:calc(var(--r42-abstand,8px)*7);padding:calc(var(--r42-abstand,8px)*5) calc(var(--r42-abstand,8px)*3)}
section[data-abschnitt]{width:100%;max-width:1080px;margin:0 auto}
</style>
<style data-el="abschluss_handlungsaufruf" data-v="1">
.r42-abschluss { text-align: center; padding: calc(var(--r42-abstand, 8px) * 6) calc(var(--r42-abstand, 8px) * 3); border-radius: 12px; background: var(--r42-primaer); color: var(--r42-grund); }
.r42-abschluss__titel { margin: 0 0 calc(var(--r42-abstand, 8px) * 2); font-family: var(--r42-schrift-ueberschrift, inherit); }
.r42-abschluss__text { margin: 0 auto calc(var(--r42-abstand, 8px) * 3); max-width: 40em; }
.r42-abschluss__knopf { display: inline-block; padding: 12px 28px; border-radius: 6px; background: var(--r42-akzent); color: var(--r42-grund); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
<section data-abschnitt="8b1ae9b7-14ff-4b6c-9d91-3b52ef206f3a" data-el="abschluss_handlungsaufruf" data-v="1">
<section class="r42-abschluss">
  <h2 class="r42-abschluss__titel">Demandez conseil dès maintenant (page B)</h2>
  <p class="r42-abschluss__text">Texte de test de la recette page B : nous vous apportons volontiers nos conseils pour votre nouvelle baignoire.</p>
  <a class="r42-abschluss__knopf" href="https://staging-test.example.com/kontakt">Demander un conseil</a>
</section>
</section>
</main>
</body>
</html>
